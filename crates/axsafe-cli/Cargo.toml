[package]
name = "axsafe-cli"
description = "AXSafe Kommandozeile: Dateien und Ordner prüfen, ehrlicher JSON-Bericht"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "axsafe"
path = "src/main.rs"

# Isolierter Scanworker (P02); wird neben axsafe ausgeliefert.
[[bin]]
name = "axsafe-worker"
path = "src/bin/axsafe-worker.rs"

# Testdoppel des Workers mit eingebauten Fehlern (Absturz, Hänger,
# Protokollbruch). NUR für Tests; die Inventarprüfung lehnt "testhelper" ab.
[[bin]]
name = "axsafe-worker-testhelper"
path = "tests/helpers/worker_testhelper.rs"
test = false
doc = false

[dependencies]
axsafe-core = { path = "../axsafe-core" }
axsafe-engine-yarax = { path = "../axsafe-engine-yarax" }
axsafe-engine-clamav = { path = "../axsafe-engine-clamav" }
axsafe-worker = { path = "../axsafe-worker" }
axsafe-service = { path = "../axsafe-service" }
axsafe-proc = { path = "../axsafe-proc" }
clap.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
md-5.workspace = true
hex.workspace = true
sha2.workspace = true
