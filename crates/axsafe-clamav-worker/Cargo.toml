[package]
name = "axsafe-clamav-worker"
description = "AXSafe: isolierter ClamAV-Worker – lädt libclamav (GPL-2.0-only) einmal und prüft übergebene Bytes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

# LIZENZ-HINWEIS (docs/LICENSE-REVIEW-libclamav.md): Dieses Programm lädt zur
# Laufzeit libclamav (GPL-2.0-only). Es darf deshalb nur Abhängigkeiten
# enthalten, die mit GPL-2.0-only vereinbar sind (z. B. MIT, BSD, ISC, Zlib,
# Unicode-3.0; bei "MIT OR Apache-2.0" wird MIT gewählt). Apache-2.0-only und
# andere unvereinbare Lizenzen sind ausgeschlossen; scripts/check_gpl_component.py
# prüft das in der CI.

[[bin]]
name = "axsafe-clamav-worker"
path = "src/main.rs"

# Testdoppel mit eingebauten Fehlern (Absturz, Hänger, falscher
# Datenbankstand). NUR für Tests; die Inventarprüfung lehnt "testhelper" ab.
[[bin]]
name = "axsafe-clamav-worker-testhelper"
path = "tests/helpers/testhelper.rs"
test = false
doc = false

[dependencies]
axsafe-core = { path = "../axsafe-core" }
axsafe-workerproto = { path = "../axsafe-workerproto" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# Nur für Tests (nicht Teil des ausgelieferten Workers; die Lizenzprüfung
# betrachtet ausschließlich die normalen Abhängigkeiten).
[dev-dependencies]
axsafe-engine-clamav = { path = "../axsafe-engine-clamav" }
axsafe-proc = { path = "../axsafe-proc" }
tempfile.workspace = true
md-5.workspace = true
hex.workspace = true
