name: Release (Vorversion)

# Getrennter Release-Job (AXS-010): läuft nur bei Tags v*, nie für Pull Requests.
# Es gibt noch KEINE Signierschlüssel; Pakete sind unsigniert und als Vorversion markiert.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version mit v, z. B. v0.1.0 (Tag wird beim Veröffentlichen des Entwurfs angelegt)"
        required: true

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    environment: release
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust-Toolchain
        run: rustup show active-toolchain; if ($LASTEXITCODE -ne 0) { rustup toolchain install }
      - name: Tests
        run: cargo test --workspace --locked
      - name: CLI bauen
        run: cargo build --release --locked -p axsafe-cli
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ui/global.json
      - name: Oberfläche bauen
        run: dotnet publish ui/AXSafe.Desktop/AXSafe.Desktop.csproj -c Release -r win-x64 --self-contained true -o dist/AXSafe
      - name: Paket
        shell: pwsh
        run: |
          # CLI in Unterordner: Windows unterscheidet axsafe.exe und AXSafe.exe nicht.
          New-Item -ItemType Directory dist/AXSafe/cli/rules -Force | Out-Null
          Copy-Item target/release/axsafe.exe dist/AXSafe/cli/
          Copy-Item -Recurse rules/* dist/AXSafe/cli/rules/
          if (-not (Test-Path dist/AXSafe/AXSafe.dll)) { throw "Oberfläche fehlt im Paket" }
          Copy-Item README.md, CHANGELOG.md, SECURITY.md dist/AXSafe/
          Get-ChildItem *.pdb -Path dist/AXSafe -Recurse | Remove-Item
          python scripts/check_release_inventory.py dist/AXSafe --allow-test-rules --inventory dist/inventory.json
          if ($LASTEXITCODE -ne 0) { throw "Inventarprüfung fehlgeschlagen" }
          $zip = "AXSafe-$env:VERSION-windows-x64-vorversion.zip"
          Compress-Archive -Path dist/AXSafe/* -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + $zip | Out-File -Encoding ascii SHA256SUMS.txt
      - name: Release-Entwurf anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^v\d+\.\d+\.\d+') { throw "Ungültige Version: $env:VERSION" }
          gh release create "$env:VERSION" --draft --prerelease --target "${{ github.sha }}" `
            --title "AXSafe $env:VERSION (Vorversion, kein Echtzeitschutz)" `
            --notes-file CHANGELOG.md `
            (Get-ChildItem AXSafe-*.zip).FullName SHA256SUMS.txt dist/inventory.json
