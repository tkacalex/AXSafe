name: Release-Entwurf (Vorversion)

# Getrennter Release-Ablauf (AXS-010, Befund 8). Nur manuell startbar.
# Regeln:
#  * Gebaut wird GENAU der Commit, für den der CI-Workflow erfolgreich war
#    (Prüfung über die Actions-API; sonst Abbruch).
#  * SBOM, Inventar, Lizenzhinweise und SHA256SUMS beziehen sich auf diesen
#    Commit und liegen dem Entwurf bei.
#  * Es entsteht nur ein ENTWURF. Veröffentlicht wird ausschließlich von Hand.
#  * Keine Signierschlüssel vorhanden: Pakete sind unsigniert (Blocker B-15).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version mit v, muss zur Workspace-Version passen, z. B. v0.2.0"
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  gate:
    name: Freigabe · CI für diesen Commit erfolgreich?
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Version passt zur Workspace-Version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Ungültige Version: $VERSION"; exit 1; }
          ws=$(grep -m1 -A3 '^\[workspace.package\]' Cargo.toml | sed -n 's/^version = "\(.*\)"/\1/p')
          [ "v$ws" = "$VERSION" ] || { echo "Version $VERSION passt nicht zu Workspace $ws"; exit 1; }
      - name: Erfolgreicher CI-Lauf für ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=success&per_page=1" --jq '.total_count')
          echo "Erfolgreiche CI-Läufe für diesen Commit: $n"
          [ "$n" -ge 1 ] || { echo "Kein erfolgreicher CI-Lauf für ${{ github.sha }} – kein Release."; exit 1; }

  sbom:
    name: SBOM und Lizenzhinweise (commitbezogen)
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust-Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: cargo-cyclonedx (gepinnt)
        run: cargo install --locked cargo-cyclonedx@0.5.9
      - name: SBOM für die Windows-CLI, mit Commit gestempelt
        run: |
          # Schreibt je Workspace-Mitglied eine Datei; verwendet wird die der CLI.
          cargo cyclonedx --manifest-path crates/axsafe-cli/Cargo.toml --format json --spec-version 1.5 \
            --target x86_64-pc-windows-msvc --no-build-deps --override-filename axsafe-cli.cdx
          python3 - <<'PY'
          import json, os, pathlib
          p = next(pathlib.Path("crates/axsafe-cli").glob("axsafe-cli.cdx.json"))
          d = json.loads(p.read_text())
          props = d.setdefault("metadata", {}).setdefault("properties", [])
          props += [{"name": "axsafe:git-commit", "value": os.environ["GITHUB_SHA"]},
                    {"name": "axsafe:version", "value": os.environ["VERSION"]},
                    {"name": "axsafe:target", "value": "x86_64-pc-windows-msvc"}]
          out = pathlib.Path(f"AXSafe-{os.environ['VERSION']}-cli-sbom.cdx.json")
          out.write_text(json.dumps(d, indent=2))
          print("SBOM:", out, len(d.get("components", [])), "Komponenten")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-sbom
          path: AXSafe-*-cli-sbom.cdx.json

  windows-package:
    name: Windows-Paket aus genau diesem Commit
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust-Toolchain
        run: rustup show active-toolchain; if ($LASTEXITCODE -ne 0) { rustup toolchain install }
      - name: Tests
        run: cargo test --workspace --locked
      - name: CLI bauen
        run: cargo build --release --locked -p axsafe-cli -p axsafe-service
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ui/global.json
      - name: Oberfläche bauen
        run: dotnet publish ui/AXSafe.Desktop/AXSafe.Desktop.csproj -c Release -r win-x64 --self-contained true -p:RestoreLockedMode=true -o dist/AXSafe
      - name: Paket und Prüfung
        shell: pwsh
        run: |
          ./scripts/ci/package.ps1 -Dist dist/AXSafe
          Set-Content dist/AXSafe/BUILD-INFO.txt "AXSafe $env:VERSION`nCommit: $env:GITHUB_SHA`nWorkflow-Lauf: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`nUnsigniert. Vorversion. Kein Echtzeitschutz."
          python scripts/check_release_inventory.py dist/AXSafe --allow-test-rules --require-notices --inventory "AXSafe-$env:VERSION-inventory.json"
          if ($LASTEXITCODE -ne 0) { throw "Inventarprüfung fehlgeschlagen" }
          Compress-Archive -Path dist/AXSafe/* -DestinationPath "AXSafe-$env:VERSION-windows-x64-vorversion.zip"
          python scripts/check_release_inventory.py "AXSafe-$env:VERSION-windows-x64-vorversion.zip" --allow-test-rules --require-notices
          if ($LASTEXITCODE -ne 0) { throw "Inventarprüfung des ZIP fehlgeschlagen" }
          Copy-Item dist/AXSafe/THIRD-PARTY-NOTICES.txt "AXSafe-$env:VERSION-THIRD-PARTY-NOTICES.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            AXSafe-*-windows-x64-vorversion.zip
            AXSafe-*-inventory.json
            AXSafe-*-THIRD-PARTY-NOTICES.txt

  draft:
    name: Entwurf anlegen (nicht veröffentlichen)
    needs: [sbom, windows-package]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Prüfsummen über ALLE Assets
        run: |
          cd assets
          sha256sum AXSafe-* | tee "SHA256SUMS-${VERSION}.txt"
      - name: Release-Entwurf
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release/Entwurf $VERSION existiert bereits – wird NICHT überschrieben."; exit 1
          fi
          gh release create "$VERSION" --draft --prerelease --target "${{ github.sha }}" \
            --title "AXSafe $VERSION (Vorversion, kein Echtzeitschutz, unsigniert)" \
            --notes-file CHANGELOG.md assets/*
