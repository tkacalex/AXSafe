[workspace]
resolver = "2"
members = [
    "crates/axsafe-proc",
    "crates/axsafe-core",
    "crates/axsafe-engine-yarax",
    "crates/axsafe-engine-clamav",
    "crates/axsafe-workerproto",
    "crates/axsafe-worker",
    "crates/axsafe-clamav-worker",
    "crates/axsafe-service",
    "crates/axsafe-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.97.0"
publish = false
repository = "https://github.com/tkacalex/AXSafe"
description = "AXSafe – mehrschichtiger Endpoint-Schutz für Windows (Vorversion, nicht als Virenschutz einsetzen)"

[workspace.dependencies]
# Exakte Versionen gepinnt (AXS-007). Cargo.lock ist eingecheckt.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
sha1 = "=0.10.6"
md-5 = "=0.10.6"
hex = "=0.4.3"
thiserror = "=2.0.21"
clap = { version = "=4.6.7", features = ["derive"] }
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde", "std"] }
yara-x = { version = "=1.22.1", default-features = false, features = [] }
tempfile = "=3.27.0"
# Nur für Tests: harmlose Containerdateien erzeugen (Befund 3)
zip = { version = "=9.1.0", default-features = false, features = ["deflate-flate2"] }
flate2 = "=1.1.10"
cfb = "=0.15.0"
cab = "=0.6.0"
sevenz-rust2 = { version = "=0.24.1", default-features = false, features = ["compress", "util"] }
libc = "=0.2.191"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Services", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip"] }

[profile.release]
lto = "thin"
codegen-units = 1
