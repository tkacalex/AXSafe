[workspace]
resolver = "2"
members = [
    "crates/axsafe-core",
    "crates/axsafe-engine-yarax",
    "crates/axsafe-engine-clamav",
    "crates/axsafe-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.0"
publish = false
repository = "https://github.com/tkacalex/AXSafe"
description = "AXSafe – mehrschichtiger Endpoint-Schutz für Windows (Vorversion, nicht als Virenschutz einsetzen)"

[workspace.dependencies]
# Exakte Versionen gepinnt (AXS-007). Cargo.lock ist eingecheckt.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
md-5 = "=0.10.6"
hex = "=0.4.3"
thiserror = "=2.0.21"
clap = { version = "=4.6.7", features = ["derive"] }
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde", "std"] }
yara-x = { version = "=1.22.0", default-features = false, features = [] }
wait-timeout = "=0.2.1"
tempfile = "=3.27.0"
libc = "0.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
codegen-units = 1
